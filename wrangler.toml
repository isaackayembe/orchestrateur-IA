name = "orchestrateur-ia"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[vars]
ALLOW_BYOK = "true"
ALLOW_TRIAL = "true"
TRIAL_DAILY_LIMIT = "20"
TRIAL_IP_DAILY_LIMIT = "60"
APPRENTISSAGE = "true"
TAUX_EXTRACTION = "0.3"
VALIDATION_AUTO_ADMIN = "true"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/admin/*", "/images/*", "/health"]



[[d1_databases]]
binding = "DB_SAVOIR"
database_name = "orchestrateur-savoir"
database_id = "35218c20-f776-498d-85e2-b1226d2fb51d"

[triggers]
crons = ["17 3 * * *"]